name: CI

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up environment variables
      run: |
        echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
        echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
        echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> $GITHUB_ENV
        echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $GITHUB_ENV
        echo "TO_EMAILS=${{ secrets.TO_EMAILS }}" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip chromium-browser chromium-chromedriver
        pip3 install selenium beautifulsoup4 jpholiday python-dotenv

    - name: Ensure correct file path
      run: |
        echo "Current working directory: $(pwd)"
        echo "Available files in $(pwd):"
        ls -lah

    - name: Run your application
      run: |
        if [ -f "test.py" ]; then
          python3 test.py
        else
          echo "test.py does not exist in the current directory"
          exit 1
        fi

    - name: Upload debug logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: debug-logs
        path: test_debug.log
