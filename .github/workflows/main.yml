name: CI

on:
  workflow_dispatch: {}   # ← 外から「Run workflow」ボタンで実行できる
  schedule:
    # 8時から24時の間で1時間ごとに実行（JST想定なら cronは注意）
    - cron: "0 0-14 * * *"
  push:
    branches:
      - master

jobs:
  build:
    runs-on: self-hosted  # ← 自宅Macのrunnerで動く

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> $GITHUB_ENV
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $GITHUB_ENV
          echo "TO_EMAILS=${{ secrets.TO_EMAILS }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python3 -m pip install -U pip
          pip3 install selenium beautifulsoup4 jpholiday python-dotenv pytz

      - name: Run your application
        run: |
          python3 index.py
